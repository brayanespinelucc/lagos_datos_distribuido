apiVersion: v1
kind: Namespace
metadata:
  name: lago-p5
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testigo
  namespace: lago-p5
spec:
  replicas: 2
  selector:
    matchLabels: {app: testigo}
  template:
    metadata:
      labels: {app: testigo}
    spec:
      nodeSelector: {lago.lab/rol: worker}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: testigo}}}
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: [sh, -ec]
          args:
            - |
              printf '%s %s\n' "$POD_NAME" "$NODE_NAME" > /www/identidad
              printf '<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba P5</title><main><h1>Prueba P5 de Kubernetes</h1><p>Pod que respondió: <b>%s</b></p><p>Worker: <b>%s</b></p></main></html>\n' "$POD_NAME" "$NODE_NAME" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /identidad, port: http}, periodSeconds: 2}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: contenido, mountPath: /www}]
      volumes: [{name: contenido, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: testigo
  namespace: lago-p5
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector: {app: testigo}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
