apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bloquear-por-defecto
  namespace: lago-m1
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portada-desde-ingress
  namespace: lago-m1
spec:
  podSelector: {matchLabels: {app: portada}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: TCP, port: 8080}]
