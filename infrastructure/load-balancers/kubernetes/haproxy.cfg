global
    log /dev/log local0
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 2s
    default-server inter 2s fall 2 rise 2

listen api
    bind 10.42.10.11:6443
    option tcp-check
    server rke2-server 10.42.10.31:6443 check

listen supervisor
    bind 10.42.10.11:9345
    option tcp-check
    server rke2-server 10.42.10.31:9345 check

listen ingress-http
    bind 10.42.10.11:80
    balance roundrobin
    option tcp-check
    server worker-1 10.42.10.32:80 check
    server worker-2 10.42.10.33:80 check

listen ingress-https
    bind 10.42.10.11:443
    balance roundrobin
    option tcp-check
    server worker-1 10.42.10.32:443 check
    server worker-2 10.42.10.33:443 check
