global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 4s
    timeout client 5m
    timeout server 5m
    timeout tunnel 1h
    timeout check 3s

frontend s3
    bind :9000
    default_backend minio_api

backend minio_api
    balance roundrobin
    option httpchk
    http-check send meth GET uri /minio/health/ready ver HTTP/1.1 hdr Host lb-minio
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server minio-1 minio-1:9000 check
    server minio-2 minio-2:9000 check
    server minio-3 minio-3:9000 check

frontend consola
    bind :9001
    default_backend minio_consola

backend minio_consola
    balance roundrobin
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host lb-minio
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server minio-1 minio-1:9001 check
    server minio-2 minio-2:9001 check
    server minio-3 minio-3:9001 check
