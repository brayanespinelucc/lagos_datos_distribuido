global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/reglas.yaml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: infraestructura
    static_configs: [{targets: ['node-exporter:9100'], labels: {entorno: ejecutor-contenedores}}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    authorization: {credentials_file: /run/secrets/minio.token}
    static_configs: [{targets: ['lb-minio:9000']}]
